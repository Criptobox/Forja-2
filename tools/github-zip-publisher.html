<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORJA — Publicar ZIP en GitHub</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f1115;color:#f4f5f7}
main{max-width:760px;margin:40px auto;padding:24px}
.card{background:#181b21;border:1px solid #30343d;border-radius:18px;padding:24px}
h1{margin-top:0}.muted{color:#a8adb8}.row{display:grid;gap:8px;margin:16px 0}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #444;background:#101217;color:#fff}
button{cursor:pointer;background:#fff;color:#111;border:0;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{white-space:pre-wrap;background:#0b0d10;border-radius:12px;padding:14px;min-height:90px}
.warn{border-left:4px solid #e0b84f;padding:10px 14px;background:#211e15;border-radius:8px}
</style>
</head>
<body>
<main><div class="card">
<h1>FORJA → GitHub</h1>
<p class="muted">Prototipo local para publicar un ZIP como repositorio nuevo.</p>
<div class="warn"><strong>Seguridad:</strong> este prototipo usa un token manual. No lo uses en producción ni guardes el token. La versión final de FORJA debe usar OAuth/backend seguro.</div>
<div class="row"><label>ZIP del proyecto</label><input id="zip" type="file" accept=".zip"></div>
<div class="row"><label>Token de GitHub</label><input id="token" type="password" autocomplete="off" placeholder="ghp_... / token compatible"></div>
<div class="row"><label>Propietario/usuario</label><input id="owner" placeholder="usuario u organización"></div>
<div class="row"><label>Nombre del nuevo repositorio</label><input id="repo" placeholder="mi-proyecto-forja"></div>
<div class="row"><label>Descripción</label><input id="description" placeholder="Sitio generado con FORJA"></div>
<button id="publish">Publicar repositorio</button>
<h3>Progreso</h3><div id="log" class="progress">Esperando ZIP…</div>
</div></main>
<script>
const $=id=>document.getElementById(id);
function log(s){$('log').textContent += "\n"+s}
$('publish').onclick=async()=>{
  const zip=$('zip').files[0], token=$('token').value.trim(), owner=$('owner').value.trim(), repo=$('repo').value.trim();
  if(!zip||!token||!owner||!repo){$('log').textContent="Faltan datos.";return}
  $('publish').disabled=true;$('log').textContent="Preparando…";
  try{
    const me=await fetch("https://api.github.com/user",{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});
    if(!me.ok) throw new Error("Token rechazado o sin permiso.");
    const identity=await me.json();
    log("Autenticado como @"+identity.login);
    if(owner!==identity.login) log("Aviso: el propietario indicado no coincide con el usuario autenticado. Se intentará igualmente.");

    const create=await fetch("https://api.github.com/user/repos",{method:"POST",headers:{
      Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"
    },body:JSON.stringify({name:repo,description:$('description').value,private:false,auto_init:true})});
    if(!create.ok) throw new Error("No se pudo crear el repositorio: "+await create.text());
    const r=await create.json(); log("Repositorio creado: "+r.html_url);

    log("El prototipo crea el repositorio, pero la carga binaria completa del ZIP requiere descomprimirlo y subir cada archivo mediante la Git Trees API.");
    log("Para evitar depender de librerías externas, esta demo se detiene aquí. La implementación final de FORJA hará el ZIP → árbol Git → commit → push de forma segura.");
    log("Repositorio: "+r.html_url);
    window.open(r.html_url,"_blank");
  }catch(e){log("ERROR: "+e.message)}
  finally{$('publish').disabled=false}
};
</script>
</body></html>
